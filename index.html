<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; base-uri 'none'; font-src 'self'; form-action 'none'; img-src 'self'; script-src 'self'; style-src 'self'; require-trusted-types-for 'script'; trusted-types 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="title" content="Abadima's Password Generator" />
    <link rel="icon" href="favicon.webp" type="image/webp" />

    <meta property="og:image" content="https://pass.abadima.dev/assets/aihoshino.webp" />
    <meta name="description"
        content="Generate strong, random passwords with my free online password generator. Private by design, with secure generation entirely in your browser and no data sent to servers." />

    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1 class="title">Password Generator</h1>

        <div class="field-title" id="result-title">Generated Password</div>
        <button class="result" id="copy" type="button" aria-labelledby="result-title copy"></button>

        <label class="field-title length__title" for="slider">Password Length</label>
        <div class="range__slider">
            <input id="slider" type="range" min="8" max="256" value="16">
        </div>

        <h2 class="field-title" id="settings-title">Settings</h2>
        <div class="settings" role="group" aria-labelledby="settings-title">
            <div class="setting">
                <input type="checkbox" id="uppercase" checked />
                <label for="uppercase">Uppercase Letters</label>
            </div>
            <div class="setting">
                <input type="checkbox" id="lowercase" checked />
                <label for="lowercase">Lowercase Letters</label>
            </div>
            <div class="setting">
                <input type="checkbox" id="number" checked />
                <label for="number">Numbers</label>
            </div>
            <div class="symbols" role="radiogroup" aria-labelledby="symbols-label">
                <span id="symbols-label">Symbols</span>
                <div class="switch3" title="Tap to cycle or drag: off, common (14 symbols), all (32 symbols)">
                    <input type="radio" name="symbols" id="symbolOff" value="off" aria-label="Off" checked />
                    <input type="radio" name="symbols" id="symbol" value="common" aria-label="Common" />
                    <input type="radio" name="symbols" id="symbolAll" value="all" aria-label="All" />
                    <span class="track"></span>
                </div>
            </div>
        </div>

        <button class="btn generate" id="generate" type="button">Generate Password</button>
        <p class="visually-hidden" id="status" role="status"></p>
    </main>

    <footer class="footer">
        Made with ♥ by <a href="https://github.com/Abadima/password-generator" rel="noreferrer"
            aria-label="Abadima, source code on GitHub">Abadima</a>
    </footer>

    <script src="script.js"></script>
</body>

</html>
